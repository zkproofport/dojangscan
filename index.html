<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta
      name="description"
      content="GIWA Sepolia의 Dojang 조회, 발급 및 권한 관리를 위한 웹앱"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Dojang Scan</title>
    <script>
      try {
        var t = localStorage.getItem("dojang-theme");
        document.documentElement.dataset.theme =
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
        document.documentElement.lang =
          localStorage.getItem("dojang-language") === "en" ? "en" : "ko";
      } catch {}
    </script>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-KV5XFCT55F"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-KV5XFCT55F");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
